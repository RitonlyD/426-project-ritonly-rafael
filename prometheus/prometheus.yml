global:
  scrape_interval: 10s

scrape_configs:
  - job_name: donor-service
    static_configs:
      - targets: ["donor-service:5100"]

  - job_name: inventory-service
    static_configs:
      - targets: ["inventory-service:5200"]

  - job_name: matching-ambassador
    static_configs:
      - targets: ["matching-ambassador:5000"]

  - job_name: matching-service
    static_configs:
      - targets:
          - "matching-service-a:4000"
          - "matching-service-b:4000"
          - "matching-service-c:4000"

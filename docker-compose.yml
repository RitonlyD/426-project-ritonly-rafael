services:
  matching-service:
    build: ./matching-service
    ports:
      - "4000:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  matching-ambassador:
    build: ./matching-ambassador
    network_mode: "service:matching-service"
    depends_on:
      matching-service:
        condition: service_started
      donor-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy

#donor-service: #Ritonly to do in Sprint 2

#inventory-service: #shared service: to do in later sprint

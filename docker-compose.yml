services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    build: ./caddy
    ports:
      - "4000:4000"
    depends_on:
      matching-service-a:
        condition: service_healthy
      matching-service-b:
        condition: service_healthy
      matching-service-c:
        condition: service_healthy

  matching-service-a:
    build: ./matching-service
    environment:
      - REPLICA=a
      - AVAILABILITY_URL=http://matching-ambassador:5000/availability
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      matching-ambassador:
        condition: service_healthy

  matching-service-b:
    build: ./matching-service
    environment:
      - REPLICA=b
      - AVAILABILITY_URL=http://matching-ambassador:5000/availability
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      matching-ambassador:
        condition: service_healthy

  matching-service-c:
    build: ./matching-service
    environment:
      - REPLICA=c
      - AVAILABILITY_URL=http://matching-ambassador:5000/availability
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      matching-ambassador:
        condition: service_healthy

  matching-ambassador:
    build: ./matching-ambassador
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      donor-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy

  inventory-service:
    build: ./inventory-service
    ports:
      - "5200:5200"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5200/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  donor-service:
    build: ./donor-service
    ports:
      - "5100:5100"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
